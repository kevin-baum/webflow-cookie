            'wordpress_': { purpose: 'WordPress Session', duration: 'Session', category: 'necessary', tool: 'WordPress' },
            'wp-settings': { purpose: 'WordPress Settings', duration: '1 Jahr', category: 'functionality', tool: 'WordPress' },
            'comment_': { purpose: 'WordPress Comments', duration: '1 Jahr', category: 'functionality', tool: 'WordPress' },
            
            // Sprache & Lokalisierung
            'pll_language': { purpose: 'Polylang Language', duration: '1 Jahr', category: 'functionality', tool: 'Polylang' },
            'googtrans': { purpose: 'Google Translate', duration: 'Session', category: 'functionality', tool: 'Google Translate' },
            
            // Cookie Consent
            'cc_cookie': { purpose: 'Cookie Consent', duration: '6 Monate', category: 'necessary', tool: 'CookieConsent' },
            'cookieconsent_status': { purpose: 'Cookie Consent Status', duration: '1 Jahr', category: 'necessary', tool: 'Cookie Consent' },
            
            // Session
            'PHPSESSID': { purpose: 'PHP Session', duration: 'Session', category: 'necessary', tool: 'PHP' },
            'JSESSIONID': { purpose: 'Java Session', duration: 'Session', category: 'necessary', tool: 'Java' },
            'ASP.NET_SessionId': { purpose: 'ASP.NET Session', duration: 'Session', category: 'necessary', tool: 'ASP.NET' },
            
            // CSRF Protection
            'csrf_token': { purpose: 'CSRF Protection', duration: 'Session', category: 'necessary', tool: 'Security' },

        };

        this.scriptDomains = {

            'googleadservices.com': 'Google Ads',
            'doubleclick.net': 'Google DoubleClick',
            'facebook.net': 'Facebook',
            'connect.facebook.net': 'Facebook Pixel',
            'hotjar.com': 'Hotjar',
            'segment.com': 'Segment',
            'segment.io': 'Segment',
            'amplitude.com': 'Amplitude',
            'mixpanel.com': 'Mixpanel',
            'linkedin.com': 'LinkedIn',
            'youtube.com': 'YouTube',

    // Deep Scan durchführen
    async performDeepScan() {
        console.log('🔍 Starte Deep Scan...');
        
        // 1. Browser Cookies scannen
        this.scanBrowserCookies();
        
        // 2. LocalStorage & SessionStorage scannen
        this.scanStorage();
        
        // 3. Alle Scripts auf der Seite analysieren
        await this.scanScripts();
        
        // 4. Iframes scannen
        this.scanIframes();
        
        // 5. Network Requests überwachen
        this.monitorNetworkRequests();
        
        console.log('✅ Deep Scan abgeschlossen');
        console.log('📊 Gefundene Tools:', Array.from(this.detectedTools));
        
        return this.scannedCookies;
    }

    scanBrowserCookies() {
        const cookies = document.cookie.split(';');
        const foundCookies = new Set();

        cookies.forEach(cookie => {
            const [name] = cookie.trim().split('=');
            if (name && !foundCookies.has(name)) {
                foundCookies.add(name);
                const cookieData = this.analyzeCookie(name, 'cookie');
                this.scannedCookies[cookieData.category].push(cookieData);
                if (cookieData.tool) this.detectedTools.add(cookieData.tool);
            }
        });
    }

    scanStorage() {
        // LocalStorage
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const cookieData = this.analyzeCookie(key, 'localStorage');
            this.scannedCookies[cookieData.category].push(cookieData);
            if (cookieData.tool) this.detectedTools.add(cookieData.tool);
        }

        // SessionStorage
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            const cookieData = this.analyzeCookie(key, 'sessionStorage');
            this.scannedCookies[cookieData.category].push(cookieData);
            if (cookieData.tool) this.detectedTools.add(cookieData.tool);
        }
    }

    async scanScripts() {
        const scripts = document.querySelectorAll('script[src]');
        
        scripts.forEach(script => {
            const src = script.src;
            
            // Prüfe bekannte Domains
            for (const [domain, tool] of Object.entries(this.scriptDomains)) {
                if (src.includes(domain)) {
                    this.detectedTools.add(tool);
                    this.detectedScripts.add(src);
                    
                    // Füge als Cookie-Info hinzu
                    const category = this.getToolCategory(tool);
                    this.scannedCookies[category].push({
                        name: `📜 ${tool} Script`,
                        purpose: `Externes Script von ${tool}`,
                        duration: 'Runtime',
                        category: category,
                        type: 'script',
                        tool: tool,
                        source: this.getDomain(src)
                    });
                }
            }
        });

        // Inline Scripts analysieren
        const inlineScripts = document.querySelectorAll('script:not([src])');
        inlineScripts.forEach(script => {
            const content = script.textContent;
            
            // Suche nach bekannten Tracking-Code-Patterns
            if (content.includes('gtag(') || content.includes('ga(')) {
                this.detectedTools.add('Google Analytics');
            }
            if (content.includes('fbq(')) {
                this.detectedTools.add('Facebook Pixel');
            }
            if (content.includes('_hjSettings')) {
                this.detectedTools.add('Hotjar');
            }
            if (content.includes('analytics.identify') || content.includes('analytics.track')) {
                this.detectedTools.add('Segment');
            }
        });
    }

    scanIframes() {
        const iframes = document.querySelectorAll('iframe[src]');
        
        iframes.forEach(iframe => {
            const src = iframe.src;
            
            for (const [domain, tool] of Object.entries(this.scriptDomains)) {
                if (src.includes(domain)) {
                    this.detectedTools.add(tool);
                }
            }
        });
    }

    monitorNetworkRequests() {
        // Performance API nutzen um Requests zu erkennen
        if (window.performance && window.performance.getEntriesByType) {
            const resources = window.performance.getEntriesByType('resource');
            
            resources.forEach(resource => {
                for (const [domain, tool] of Object.entries(this.scriptDomains)) {
                    if (resource.name.includes(domain)) {
                        this.detectedTools.add(tool);
                    }
                }
            });
        }
    }

    analyzeCookie(name, storageType = 'cookie') {
        // Prüfe exakte Übereinstimmungen
        if (this.cookieDatabase[name]) {
            const data = this.cookieDatabase[name];
            return {
                name: name,
                purpose: data.purpose,
                duration: data.duration,
                category: data.category,
                type: storageType,
                tool: data.tool,
                source: 'Database'
            };
        }

        // Prüfe Teilübereinstimmungen
        for (const [pattern, data] of Object.entries(this.cookieDatabase)) {
            if (name.toLowerCase().includes(pattern.toLowerCase())) {
                return {
                    name: name,
                    purpose: data.purpose,
                    duration: data.duration,
                    category: data.category,
                    type: storageType,
                    tool: data.tool,
                    source: 'Database'
                };
            }
        }

        // Fallback: Intelligente Kategorisierung
        const category = this.guessCategory(name);
        const tool = this.guessTool(name);
        
        return {
            name: name,
            purpose: this.guessPurpose(name),
            duration: storageType === 'sessionStorage' ? 'Session' : '1 Jahr',
            category: category,
            type: storageType,
            tool: tool,
            source: 'Auto-detected'
        };
    }

    guessCategory(name) {
        const n = name.toLowerCase();
        
        if (n.includes('ga') || n.includes('analytics') || n.includes('_hj') || n.includes('utm') || 
            n.includes('amplitude') || n.includes('mixpanel') || n.includes('segment')) {
            return 'analytics';
        }
        if (n.includes('fb') || n.includes('ad') || n.includes('marketing') || n.includes('pixel') ||
            n.includes('doubleclick') || n.includes('linkedin') || n.includes('twitter')) {
            return 'marketing';
        }
        if (n.includes('lang') || n.includes('locale') || n.includes('preference') || n.includes('settings') ||
            n.includes('theme') || n.includes('currency')) {
            return 'functionality';
        }
        if (n.includes('session') || n.includes('csrf') || n.includes('xsrf') || n.includes('auth') ||
            n.includes('token') || n.includes('security') || n.includes('wf_') || n.includes('webflow')) {
            return 'necessary';
        }
        
        return 'functionality';
    }

    guessPurpose(name) {
        const n = name.toLowerCase();
        
        if (n.includes('ga')) return 'Google Analytics Tracking';
        if (n.includes('fb')) return 'Facebook Tracking';
        if (n.includes('ad')) return 'Werbung & Marketing';
        if (n.includes('session')) return 'Session Management';
        if (n.includes('lang')) return 'Spracheinstellung';
        if (n.includes('wf') || n.includes('webflow')) return 'Webflow Platform';
        if (n.includes('analytics')) return 'Analyse & Tracking';
        
        return 'Website-Funktionalität';
    }

    guessTool(name) {
        const n = name.toLowerCase();
        
        if (n.includes('ga') || n.includes('_gid') || n.includes('_gat') || n.includes('__utm')) return 'Google Analytics';
        if (n.includes('fb') || n.includes('_fbp')) return 'Facebook';
        if (n.includes('_hj')) return 'Hotjar';
        if (n.includes('wf_') || n.includes('webflow')) return 'Webflow';
        if (n.includes('stripe')) return 'Stripe';
        if (n.includes('amplitude')) return 'Amplitude';
        if (n.includes('mixpanel') || n.includes('mp_')) return 'Mixpanel';
        if (n.includes('segment') || n.includes('ajs_')) return 'Segment';
        if (n.includes('linkedin') || n.includes('li_')) return 'LinkedIn';
        
        return null;
    }

    getToolCategory(tool) {
        const marketingTools = ['Google Ads', 'Google DoubleClick', 'Facebook', 'Facebook Pixel', 'LinkedIn', 'Twitter/X', 'YouTube'];
        const analyticsTools = ['Google Analytics', 'Hotjar', 'Segment', 'Amplitude', 'Mixpanel', 'Google Tag Manager'];
        const necessaryTools = ['Webflow', 'Stripe', 'PHP', 'Java', 'ASP.NET', 'Security'];
        
        if (marketingTools.includes(tool)) return 'marketing';
        if (analyticsTools.includes(tool)) return 'analytics';
        if (necessaryTools.includes(tool)) return 'necessary';
        
        return 'functionality';
    }

    getDomain(url) {
        try {
            const urlObj = new URL(url);
            return urlObj.hostname;
        } catch {
            return 'unknown';
        }
    }

    generateCookieListHTML(category) {
        const cookies = this.scannedCookies[category];
        
        if (cookies.length === 0) {
            return '<p style="color: #718096; font-size: 13px; text-align: center; padding: 20px;">Keine Cookies in dieser Kategorie gefunden.</p>';
        }

        let html = `<div class="cookie-details">`;
        html += `<div style="margin-bottom: 10px; color: #4a5568; font-weight: 600;">Gefundene Cookies & Scripts: <span class="cookie-count">${cookies.length}</span></div>`;
        
        cookies.forEach(cookie => {
            html += `
                <div class="cookie-item">
                    <div style="flex: 1;">
                        <div class="cookie-name">${cookie.name}</div>
                        <div class="cookie-info">${cookie.duration} • ${cookie.type}</div>
                        <div class="cookie-purpose">${cookie.purpose}</div>
                        ${cookie.tool ? `<div class="cookie-source">🔧 ${cookie.tool}</div>` : ''}
                    </div>
                </div>
            `;
        });

        html += '</div>';
        return html;
    }

    getCategoryDescription(category) {
        const count = this.scannedCookies[category].length;
        const descriptions = {
            necessary: `Diese Cookies und Scripts sind essentiell für die Funktion der Website.`,
            functionality: `Diese Elemente ermöglichen erweiterte Funktionen und verbessern die Nutzer-Erfahrung.`,
            analytics: `Diese Tools helfen uns, die Website-Nutzung zu verstehen und zu optimieren.`,
            marketing: `Diese Technologien werden für Werbung und Marketing verwendet.`
        };
        return `${descriptions[category]} <strong>Aktuell ${count} Element(e) erkannt.</strong>`;
    }

    getToolsSummary() {
        if (this.detectedTools.size === 0) {
            return '<div class="scan-status">✅ Keine externen Tracking-Tools erkannt</div>';
        }
        
        const tools = Array.from(this.detectedTools).sort();
        let html = '<div class="scan-status">🔍 Deep Scan: Folgende Tools wurden erkannt:<br><br>';
        tools.forEach(tool => {
            html += `<span style="background: white; padding: 4px 8px; margin: 2px; display: inline-block; border-radius: 4px; font-size: 11px;">🛠️ ${tool}</span> `;
        });
        html += '</div>';
        return html;
    }
}

// Scanner initialisieren
const scanner = new DeepCookieScanner();

// Initial Deep Scan
setTimeout(async () => {
    await scanner.performDeepScan();
    console.log('🍪 Deep Cookie-Scan abgeschlossen:', scanner.scannedCookies);
    console.log('🔧 Erkannte Tools:', Array.from(scanner.detectedTools));
}, 1500);

// Periodischer Re-Scan für dynamisch geladene Cookies
setInterval(async () => {
    scanner.scannedCookies = {
        necessary: [],
        functionality: [],
        analytics: [],
        marketing: []
    };
    await scanner.performDeepScan();
}, CONFIG.deepScanInterval);

// ===================================
// COOKIE-EINSTELLUNGEN BUTTON
// ===================================
function createCookieSettingsButton() {
    if (document.getElementById('cookie-settings-btn')) return;
    
    const button = document.createElement('button');
    button.id = 'cookie-settings-btn';
    button.innerHTML = '🍪 Cookie-Einstellungen';
    button.setAttribute('aria-label', 'Cookie-Einstellungen öffnen');
    button.setAttribute('type', 'button');
    
    button.style.cssText = `
        position: fixed !important;
        bottom: 20px !important;
        left: 20px !important;
        z-index: 2147483647 !important;
        background: #2d3748 !important;
        color: white !important;
        border: none !important;
        border-radius: 8px !important;
        padding: 12px 20px !important;
        font-size: 14px !important;
        font-weight: 500 !important;
        cursor: pointer !important;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1) !important;
        transition: all 0.3s ease !important;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
        display: flex !important;
        align-items: center !important;
        gap: 8px !important;
    `;
    
    button.addEventListener('mouseenter', () => {
        button.style.background = '#1a202c';
        button.style.transform = 'translateY(-2px)';
    });
    
    button.addEventListener('mouseleave', () => {
        button.style.background = '#2d3748';
        button.style.transform = 'translateY(0)';
    });
    
    button.addEventListener('click', async function() {
        // Re-scan vor Öffnen
        await scanner.performDeepScan();
        CookieConsent.showPreferences();
    });
    
    document.body.appendChild(button);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', createCookieSettingsButton);
} else {
    createCookieSettingsButton();
}

window.addEventListener('cc:onConsent', createCookieSettingsButton);
